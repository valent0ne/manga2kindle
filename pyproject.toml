[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "manga2kindle"
version = "0.2.1"
description = "Cross-platform headless CLI to convert CBZ/CBR manga into PDOC-tagged KFX with Guided View panels"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "opencv-python-headless>=4.8.0",
    "pillow>=10.0.0",
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "rarfile>=4.0",
    "KindleComicConverter @ git+https://github.com/ciromattia/kcc.git",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
onnx = [
    "onnxruntime>=1.17",
    "platformdirs>=4.0",
]
magi = [
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.40",
    "einops>=0.7",
    "timm>=0.9",
    "platformdirs>=4.0",
    "huggingface_hub>=0.23",
    "scipy>=1.11",
    "pytorch-metric-learning>=2.0",
    "shapely>=2.0",
    "networkx>=3.0",
    "matplotlib>=3.7",
]

[project.scripts]
manga2kindle = "manga2kindle.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/manga2kindle"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
